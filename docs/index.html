<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b8a3e" />
    <title>SUWE</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body data-mode="menu">
    <canvas id="stage"></canvas>

    <div class="startng-card" id="player-card" hidden>
      <span class="avatar"><img id="player-face" alt="" hidden /><b id="player-initials"></b></span>
      <div class="who">
        <b id="player-name"></b>
        <span id="player-account"></span>
      </div>
      <a id="player-sign-in" class="signin" hidden>Sign in</a>
    </div>

    <!-- In a match -->
    <div class="play-only" id="hud">
      <button id="sound-btn" type="button"></button>
      <button id="menu-btn" type="button">Menu</button>
      <div id="board"></div>
      <div id="row3">
        <div id="pips"></div>
        <div id="hud-lives" class="lives"></div>
      </div>
      <div id="turn"></div>
    </div>
    <div id="toast" role="status"></div>
    <div class="play-only" id="hud-bottom">
      <p id="hint"></p>
      <div id="meter" hidden>
        <div id="zone"></div>
        <div id="needle"></div>
      </div>
      <button id="pickup" type="button" hidden>Pick up</button>
    </div>

    <!-- Screens -->
    <section id="menu" class="screen">
      <h1>SUWE</h1>
      <p class="tagline">The Nigerian hopping game</p>
      <button id="continue" class="big go alt" type="button" hidden>Continue match</button>
      <button id="play" class="big go" type="button">Play SUWE</button>
      <div class="menu-links">
        <button id="open-howto" class="opt" type="button">How to play<span class="new" id="howto-new">New</span></button>
        <button id="open-lb" class="opt" type="button">Leaderboard</button>
        <button id="open-settings" class="opt" type="button">Settings</button>
      </div>
      <div id="menu-lives" class="lives big-lives"></div>
    </section>
    <section id="setup" class="screen" hidden></section>
    <section id="howto" class="screen" hidden></section>
    <section id="settings" class="screen" hidden>
      <button id="settings-back" class="setup-back" type="button">‹  Back</button>
      <h2 class="setup-title">Settings</h2>
      <p class="setup-sub">Sound and your saved match</p>
      <div class="card wide settings-card">
        <button id="opt-music" class="opt row" type="button"></button>
        <button id="opt-sfx" class="opt row" type="button"></button>
        <button id="opt-voice" class="opt row" type="button"></button>
        <p class="why" id="voice-note">Voice lines read a few key phrases aloud, like "Try again".</p>
        <button id="discard-save" class="opt row" type="button" hidden>Delete saved match</button>
      </div>
    </section>
    <section id="leaderboard" class="screen" hidden>
      <button id="lb-back" class="setup-back" type="button">‹  Back</button>
      <h2 class="setup-title">Leaderboard</h2>
      <p class="setup-sub">Best matches against the computer</p>
      <div class="card wide lb-card">
        <p id="lb-status" class="why"></p>
        <table id="lb-table" hidden>
          <thead>
            <tr><th>#</th><th>Player</th><th>Houses</th><th>Acc.</th><th>Miss</th><th>Time</th></tr>
          </thead>
          <tbody id="lb-rows"></tbody>
        </table>
      </div>
    </section>
    <section id="gate" class="screen" hidden>
      <div class="card">
        <h2 id="gate-title"></h2>
        <p id="gate-text"></p>
        <a id="gate-signin" class="big" hidden>Sign in with start.ng</a>
        <button id="gate-back" class="link" type="button">Back</button>
      </div>
    </section>

    <section id="results" class="screen" hidden>
      <div class="card wide">
        <h2 id="results-title"></h2>
        <p id="results-winner" class="winner"></p>
        <p id="results-why" class="why"></p>
        <table>
          <thead>
            <tr><th>Player</th><th>Houses</th><th>Accuracy</th><th>Mistakes</th></tr>
          </thead>
          <tbody id="results-rows"></tbody>
        </table>
        <p id="results-time" class="why"></p>
        <p id="results-score" class="why"></p>
        <p id="results-hearts" class="why"></p>
        <button id="results-again" class="big" type="button">Play again</button>
        <button id="results-menu" class="link" type="button">Menu</button>
      </div>
    </section>

    <div id="celebrate" hidden>
      <div id="confetti"></div>
      <div class="boom">
        <h2>You Don Buy House!</h2>
        <p id="celebrate-sub"></p>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
