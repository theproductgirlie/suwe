<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b8a3e" />
    <title>SUWE</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div class="startng-card" id="player-card" hidden>
      <img id="player-face" alt="" hidden />
      <div>
        <b id="player-name"></b>
        <span id="player-account"></span>
      </div>
      <a id="player-sign-in" class="signin" hidden>Sign in</a>
    </div>

    <div id="hud-top">
      <div class="pill"><b id="target"></b><span id="turn"></span></div>
      <div id="pips"></div>
    </div>
    <button id="reset" type="button" aria-label="New game">New game</button>

    <div id="toast" role="status"></div>

    <div id="hud-bottom">
      <p id="hint"></p>
      <div id="meter" hidden>
        <div id="zone"></div>
        <div id="needle"></div>
      </div>
      <button id="pickup" type="button" hidden>Pick up</button>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
