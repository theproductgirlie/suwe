<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffe6c7" />
    <title>SUWE</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body data-mode="menu">
    <!-- Sun and hill behind the 3D court on the home screen -->
    <div id="art" aria-hidden="true"><i class="sun"></i><i class="hill"></i></div>
    <canvas id="stage"></canvas>

    <!-- Who is playing (start.ng): home only -->
    <div class="profile" id="player-card" hidden>
      <span class="avatar"><img id="player-face" alt="" hidden /><b id="player-initials"></b></span>
      <div class="who">
        <b id="player-name"></b>
        <span id="player-account"></span>
        <span class="lives-line" id="profile-lives"></span>
      </div>
      <a id="player-sign-in" class="signin" hidden>Sign in</a>
    </div>
    <button id="open-settings" class="round-btn settings-btn" type="button" aria-label="Settings">
      <span data-icon="sliders" data-size="24"></span><span class="btn-text">Settings</span>
    </button>

    <!-- In a match -->
    <div class="play-only" id="hud">
      <header id="topbar">
        <button id="menu-btn" class="round-btn" type="button" aria-label="Pause"><span data-icon="pause" data-size="22"></span></button>
        <div id="banner"></div>
        <button id="sound-btn" class="round-btn" type="button" aria-label="Sound"></button>
      </header>
      <div id="board"></div>
    </div>

    <!-- The instruction card when a turn starts (2 seconds) -->
    <div id="turncard" hidden>
      <span class="kicker" id="turncard-kicker">Your turn</span>
      <h2 id="turncard-title">Throw at square 1</h2>
      <p id="turncard-sub"></p>
      <div class="countdown"><i id="turncard-bar"></i></div>
    </div>

    <!-- The balance meter and Pick up, when a move needs them -->
    <div class="play-only" id="meterwrap">
      <div id="meter" hidden>
        <div id="zone"></div>
        <div id="needle"></div>
      </div>
      <button id="pickup" class="big" type="button" hidden>Pick up</button>
    </div>

    <!-- Bottom of the match: what to do now, or the computer's controls, or a miss -->
    <div class="dock dark play-only" id="bar" role="status">
      <span class="dock-ico" id="bar-ico"></span>
      <div class="dock-text"><b id="bar-title"></b><small id="bar-sub"></small></div>
    </div>
    <div class="dock light play-only" id="watchbar" hidden>
      <b id="watch-title">Tunde is hopping…</b>
      <button id="speed-btn" class="ghost-btn" type="button"><span id="speed-text">2× faster</span></button>
      <button id="skip-btn" class="big small" type="button">Skip <kbd>S</kbd></button>
    </div>
    <div class="dock light" id="pill" hidden role="status">
      <span class="dock-ico red"><span data-icon="heart" data-size="24"></span></span>
      <div class="dock-text"><b id="pill-title"></b><small id="pill-sub"></small></div>
    </div>

    <div id="toast" role="status"></div>

    <!-- Pause: a sheet on the phone, a window on the desktop -->
    <div id="pause-scrim"></div>
    <aside id="pause-menu" role="dialog" aria-modal="true" aria-labelledby="pause-title" aria-hidden="true">
      <span class="grab" aria-hidden="true"></span>
      <button id="pause-close" class="round-btn close-x" type="button" aria-label="Close"><span data-icon="x" data-size="20"></span></button>
      <div class="pause-head">
        <h2 id="pause-title">Paused</h2>
        <p class="soft" id="pause-sub"></p>
      </div>
      <button id="pause-resume" class="big" type="button">Resume <kbd>Esc</kbd></button>
      <div class="toggles">
        <button id="pause-music" class="toggle" type="button" role="switch"></button>
        <button id="pause-sfx" class="toggle" type="button" role="switch"></button>
        <button id="pause-voice" class="toggle" type="button" role="switch"></button>
      </div>
      <div class="pause-btns">
        <button id="pause-howto" class="outline-btn" type="button">How to play</button>
        <button id="pause-leave" class="outline-btn" type="button">Save and quit</button>
      </div>
    </aside>

    <!-- Screens -->
    <section id="menu" class="screen">
      <div class="menu-copy">
        <h1 class="wordmark">SUWE</h1>
        <p class="tagline">The Nigerian hopping game<span class="wide-only">. Throw the stone, hop the court, build your house.</span></p>
      </div>
      <div class="menu-actions">
        <button id="play" class="big go" type="button">Play</button>
        <div id="continue-card" class="card saved" hidden>
          <span class="saved-dots" id="saved-dots"></span>
          <div class="saved-text">
            <span class="kicker">Saved match</span>
            <b id="saved-line"></b>
          </div>
          <button id="continue" class="ghost-btn" type="button">Resume</button>
        </div>
        <div class="tiles">
          <button id="open-howto" class="tile" type="button">
            <span class="tile-ico" data-icon="book" data-size="26"></span><span class="tile-text"><b>How to play</b><small>7 quick steps</small></span>
            <span class="new" id="howto-new">New</span>
          </button>
          <button id="open-lb" class="tile" type="button">
            <span class="tile-ico" data-icon="trophy" data-size="26"></span><span class="tile-text"><b>Leaderboard</b><small id="lb-hint">Top spot is open</small></span>
          </button>
        </div>
      </div>
    </section>
    <section id="setup" class="screen" hidden></section>
    <section id="howto" class="screen" hidden></section>
    <section id="settings" class="screen" hidden>
      <div class="screen-head">
        <button id="settings-back" class="round-btn back-btn" type="button" aria-label="Back"><span data-icon="back" data-size="24"></span></button>
        <h2 class="setup-title">Settings</h2>
      </div>
      <div class="card wide settings-card">
        <div class="toggles">
          <button id="opt-music" class="toggle" type="button" role="switch"></button>
          <button id="opt-sfx" class="toggle" type="button" role="switch"></button>
          <button id="opt-voice" class="toggle" type="button" role="switch"></button>
        </div>
        <button id="discard-save" class="outline-btn" type="button" hidden>Delete saved match</button>
      </div>
    </section>
    <section id="leaderboard" class="screen" hidden>
      <div class="screen-head">
        <button id="lb-back" class="round-btn back-btn" type="button" aria-label="Back"><span data-icon="back" data-size="24"></span></button>
        <h2 class="setup-title">Leaderboard</h2>
      </div>
      <div class="lb-layout">
        <div class="lb-left">
          <div class="lb-empty" id="lb-empty" hidden>
            <span class="lb-trophy" data-icon="trophy" data-size="56"></span>
            <h3>No winners yet</h3>
            <p id="lb-status"></p>
          </div>
          <div class="lb-cta"><button id="lb-play" class="big" type="button">Play the computer</button></div>
        </div>
        <div class="lb-right">
          <div class="tabs lb-tabs" id="lb-tabs">
            <button class="chip on" type="button" data-level="2">Medium</button>
            <button class="chip" type="button" data-level="3">Hard</button>
          </div>
          <div class="lb-list" id="lb-list"></div>
        </div>
      </div>
    </section>
    <section id="gate" class="screen" hidden>
      <div class="card">
        <h2 id="gate-title"></h2>
        <p id="gate-text"></p>
        <a id="gate-signin" class="big" hidden>Sign in with start.ng</a>
        <button id="gate-back" class="link" type="button">Back</button>
      </div>
    </section>

    <section id="results" class="screen" hidden>
      <div class="card wide">
        <h2 id="results-title"></h2>
        <p id="results-winner" class="winner"></p>
        <p id="results-why" class="why"></p>
        <table>
          <thead>
            <tr><th>Player</th><th>Houses</th><th>Accuracy</th><th>Mistakes</th></tr>
          </thead>
          <tbody id="results-rows"></tbody>
        </table>
        <p id="results-time" class="why"></p>
        <p id="results-score" class="why"></p>
        <p id="results-hearts" class="why"></p>
        <button id="results-again" class="big" type="button">Play again</button>
        <button id="results-menu" class="link" type="button">Menu</button>
      </div>
    </section>

    <div id="celebrate" hidden>
      <div id="confetti"></div>
      <div class="boom">
        <h2>You Don Buy House!</h2>
        <p id="celebrate-sub"></p>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
